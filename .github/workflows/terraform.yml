name: Terraform Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # CI-safe fallback: validate Terraform without requiring AWS credentials.
      - name: Terraform Format Check
        working-directory: ./infrastructure
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (offline validation mode)
        working-directory: ./infrastructure
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ./infrastructure
        run: terraform validate

      - name: Detect AWS credentials
        id: aws
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials
        if: steps.aws.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Plan (AWS)
        if: steps.aws.outputs.available == 'true'
        working-directory: ./infrastructure
        run: terraform plan -no-color
        continue-on-error: true

      - name: CI fallback summary
        if: steps.aws.outputs.available != 'true'
        run: echo "AWS credentials unavailable; Terraform syntax/provider validation passed in offline CI mode. Deployment is deferred."
